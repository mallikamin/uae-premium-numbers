name = "uae-premium-numbers"
main = "worker.js"
compatibility_date = "2024-12-18"

# 2026-09-15: the live domain is this Worker (GitHub Pages retired). Declared
# here so every `wrangler deploy` keeps both custom domains attached.
routes = [
  { pattern = "uaepremiumnumbers.com", custom_domain = true },
  { pattern = "www.uaepremiumnumbers.com", custom_domain = true }
]

# Serve everything except /api/* as static assets from the repo root.
# Worker handles /api/tiktok-event; all other paths fall through to ASSETS.
[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "404-page"

# TIKTOK_EVENTS_API_TOKEN and TIKTOK_PIXEL_ID are configured in the
# Cloudflare dashboard under Settings -> Variables and Secrets, NOT here
# (never commit secrets).
