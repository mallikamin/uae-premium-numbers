<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Garah Mobile Shop — 148x105mm Landscape</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    @page { size: 148mm 105mm; margin: 0; }
    html, body {
      width: 148mm;
      height: 105mm;
      overflow: hidden;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #C8102E;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .standee {
      width: 148mm;
      height: 105mm;
      background: #C8102E;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: 8mm 10mm;
      gap: 8mm;
    }
    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .heading {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 6.5mm;
      color: #fff;
      line-height: 1.2;
      margin-bottom: 1.5mm;
    }
    .heading .gold { color: #FFD200; }
    .subtitle {
      font-family: 'DM Sans', sans-serif;
      font-size: 3mm;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.8mm;
      margin-bottom: 5mm;
    }
    .cta {
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 2.6mm;
      color: rgba(255,255,255,0.65);
      text-transform: uppercase;
      letter-spacing: 1.5mm;
    }
    .qr-wrap {
      background: #fff;
      border-radius: 3.5mm;
      padding: 3.5mm;
      margin-bottom: 3mm;
      line-height: 0;
    }
    .company {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 5mm;
      color: #fff;
      text-align: center;
      max-width: 55mm;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
<div class="standee">
  <div class="left">
    <div class="heading">
      Choose <span class="gold">Golden</span><br>
      Numbers with<br>
      Postpaid Plans
    </div>
    <div class="subtitle">Silver &bull; Gold &bull; Platinum</div>
    <div class="cta">Scan to Browse</div>
  </div>
  <div class="right">
    <div class="qr-wrap"><div id="qr"></div></div>
    <div class="company">Al Garah Mobile Shop</div>
  </div>
</div>
<script>
new QRCode(document.getElementById('qr'), {
  text: 'https://uaepremiumnumbers.com/choose-number/?ref=ggu8ey5h',
  width: 512, height: 512,
  colorDark: '#000000', colorLight: '#FFFFFF',
  correctLevel: QRCode.CorrectLevel.M
});
// Force img sizing for print
setTimeout(function() {
  var img = document.querySelector('#qr img');
  if (img) { img.style.width = '35mm'; img.style.height = '35mm'; }
  var canvas = document.querySelector('#qr canvas');
  if (canvas) { canvas.style.width = '35mm'; canvas.style.height = '35mm'; }
}, 100);
</script>
</body>
</html>
